<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Ciclo del Sprint en Scrum</title><desc id="d">El Product Backlog se refina en la Sprint Planning hacia el Sprint Backlog; durante el Sprint de 1 a 4 semanas se realiza la Daily Scrum cada 24 horas; se obtiene un Incremento que se revisa en la Sprint Review y el equipo mejora en la Retrospectiva.</desc>
