<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas S.Q.S</title>
  <link rel="stylesheet" href="lib/runner.css">
</head>
<body>
  <header class="head">
    <h1>Pruebas automáticas · S.Q.S</h1>
    <p>Historias de usuario: US-01, US-02, US-07, US-09, US-14, US-16 y US-17</p>
    <p id="summary" class="summary">Ejecutando pruebas…</p>
  </header>
  <main id="output"></main>
  <div id="sandbox" aria-hidden="true"></div>

  <script type="module">
    import { run } from './lib/runner.js';
    import us01 from './specs/us-01.js';
    import us02 from './specs/us-02.js';
    import us07 from './specs/us-07.js';
    import us09 from './specs/us-09.js';
    import us14 from './specs/us-14.js';
    import us16 from './specs/us-16.js';
    import us17 from './specs/us-17.js';

    run([us01, us02, us07, us09, us14, us16, us17], {
      output: document.getElementById('output'),
      sandbox: document.getElementById('sandbox'),
      summary: document.getElementById('summary'),
    });
  </script>
</body>
</html>
